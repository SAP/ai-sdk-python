name: setup
description: Checkout repo, set up Python and uv, and install dependencies.
inputs:
  ref:
    description: 'Git ref to checkout'
    default: ''
  python-version:
    description: 'Python version'
    default: '3.13'
  registry-username:
    description: 'Username for the PyPI registry'
    default: ''
  registry-token:
    description: 'Auth token for the PyPI registry'
    default: ''

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ inputs.ref }}

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 #v8.2.0
    - name: Install dependencies
      shell: bash
      env:
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
      run: |
        if [[ "$IS_FORK" == "true" ]]; then
          # forks don't have access to the artifactory registry, so we skip --locked and fall back to PyPI
          UV_INDEX_URL="https://pypi.org/simple/" \
            uv sync --all-packages --all-extras
        else
          UV_INDEX_ARTIFACTORY_USERNAME="${REGISTRY_USERNAME}" \
          UV_INDEX_ARTIFACTORY_PASSWORD="${REGISTRY_TOKEN}" \
            uv sync --all-packages --all-extras --locked
        fi
