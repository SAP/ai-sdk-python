version: 2
updates:
  - package-ecosystem: uv
    target-branch: 'main'
    directory: /
    schedule:
      interval: daily
      time: '22:00'
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    target-branch: 'main'
    directory: /
    schedule:
      interval: daily
      time: '22:00'
    cooldown:
      default-days: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      codeql:
        patterns:
          - 'github/codeql-action/*'
