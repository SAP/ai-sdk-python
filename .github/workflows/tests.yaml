name: Tests

on:
  workflow_dispatch:
  schedule:
    # Run tests daily at 22:00 UTC
    - cron: '0 22 * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: 'Unit Tests - Python ${{ matrix.python-version }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run unit tests with coverage
        run: |
          mkdir -p test-results
          pytest -p pytest_cov \
            --cov=./gen_ai_hub \
            --cov-report xml:test-results/coverage.xml \
            --cov-report html:test-results/coverage-html \
            --cov-report term-missing \
            --junit-xml=test-results/unit-tests.xml \
            --verbosity=2 \
            -ra \
            --disable-warnings \
            tests

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-py${{ matrix.python-version }}
          path: test-results/
          retention-days: 30

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: test-results/coverage.xml

  integration-tests:
    name: 'Integration Tests - Python ${{ matrix.python-version }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    # Only run integration tests if credentials are available (not on external PRs)
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run integration tests (core)
        env:
          AICORE_RESOURCE_GROUP: gen-ai-hub-sdk
          AICORE_BASE_URL: ${{ secrets.AICORE_BASE_URL }}
          AICORE_AUTH_URL: ${{ secrets.AICORE_AUTH_URL }}
          AICORE_CLIENT_ID: ${{ secrets.AICORE_CLIENT_ID }}
          AICORE_CLIENT_SECRET: ${{ secrets.AICORE_CLIENT_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p test-results
          pytest --cov=./gen_ai_hub \
            --junit-xml=test-results/integration-tests-core.xml \
            --cov-report xml:test-results/integration-coverage-core.xml \
            --verbosity=2 \
            -ra \
            --disable-warnings \
            -m "not bedrock" \
            integration_tests || true

          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          report_path = "test-results/integration-tests-core.xml"
          max_failure_rate = 0.10

          try:
            root = ET.parse(report_path).getroot()
          except FileNotFoundError:
            print(f"ERROR: Missing JUnit report: {report_path}")
            sys.exit(1)

          def to_int(value):
            if value is None:
              return 0
            try:
              return int(float(value))
            except ValueError:
              return 0

          if root.tag == "testsuites":
            suites = root.findall("testsuite")
            tests = sum(to_int(s.attrib.get("tests")) for s in suites)
            failures = sum(to_int(s.attrib.get("failures")) for s in suites)
            errors = sum(to_int(s.attrib.get("errors")) for s in suites)
            skipped = sum(to_int(s.attrib.get("skipped")) for s in suites)
          elif root.tag == "testsuite":
            tests = to_int(root.attrib.get("tests"))
            failures = to_int(root.attrib.get("failures"))
            errors = to_int(root.attrib.get("errors"))
            skipped = to_int(root.attrib.get("skipped"))
          else:
            print(f"ERROR: Unsupported JUnit root tag: {root.tag}")
            sys.exit(1)

          failed = failures + errors
          executed = max(0, tests - skipped)

          if executed == 0:
            print("ERROR: No executed non-bedrock integration tests found.")
            sys.exit(1)

          failure_rate = failed / executed
          summary = (
            f"Executed={executed}, Failed={failed} (failures={failures}, errors={errors}), "
            f"Skipped={skipped}, FailureRate={failure_rate:.2%}, Threshold={max_failure_rate:.2%}"
          )

          if failure_rate > max_failure_rate:
            print(f"FAIL: {summary}")
            sys.exit(1)

          if failed > 0:
            print(f"WARNING: {summary}")
          else:
            print(f"PASS: {summary}")
          PY
        if: ${{ secrets.AICORE_BASE_URL != '' && secrets.AICORE_AUTH_URL != '' && secrets.AICORE_CLIENT_ID != '' && secrets.AICORE_CLIENT_SECRET != '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-py${{ matrix.python-version }}
          path: test-results/
          retention-days: 30

  test-results:
    name: 'Publish Test Results'
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-test-results

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/unit-tests.xml'
          check_name: 'Test Results'

      - name: Comment on PR with test summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find and read coverage reports
            let coverage_info = '';
            const artifact_dirs = fs.readdirSync('all-test-results');
            for (const dir of artifact_dirs) {
              const coverage_file = path.join('all-test-results', dir, 'coverage.xml');
              if (fs.existsSync(coverage_file)) {
                coverage_info += `✅ Coverage report available in artifacts: ${dir}\n`;
              }
            }
            
            const comment = `## Test Results Summary\n\n${coverage_info || 'No coverage reports found'}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });


