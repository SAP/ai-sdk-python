name: Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/generative-ai-hub-sdk/**'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/generative-ai-hub-sdk/**'
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-pr:
    name: PR Title Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    steps:
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          subjectPattern: ^[A-Z].+$
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build

  lint:
    name: 'Linter - Python ${{ matrix.python-version }}'
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request_target'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dependencies
        working-directory: packages/generative-ai-hub-sdk
        run: uv sync --all-extras

      - name: Run pylint
        working-directory: packages/generative-ai-hub-sdk
        run: |
          mkdir -p pylint-reports
          uv run pylint gen_ai_hub \
            --errors-only \
            --output-format=json \
            > pylint-reports/pylint-py${{ matrix.python-version }}.json
          uv run pylint gen_ai_hub \
            --errors-only \
            --output-format=colorized

      - name: Upload pylint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pylint-reports-py${{ matrix.python-version }}
          path: packages/generative-ai-hub-sdk/pylint-reports/
          retention-days: 30

  lint-summary:
    name: 'Lint Summary'
    runs-on: ubuntu-latest
    needs: [lint]
    if: always() && github.event_name != 'pull_request_target'
    steps:
      - name: Check lint status
        run: |
          echo "## Lint Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.lint.result }}" = "success" ]; then
            echo "✅ All linting checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Linting checks failed" >> $GITHUB_STEP_SUMMARY
          fi
