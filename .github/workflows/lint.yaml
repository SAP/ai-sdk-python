name: Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: 'Linter - Python ${{ matrix.python-version }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run pylint
        run: |
          mkdir -p pylint-reports
          pylint gen_ai_hub \
            --output-format=json \
            > pylint-reports/pylint-py${{ matrix.python-version }}.json
          pylint gen_ai_hub \
            --output-format=colorized

      - name: Upload pylint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pylint-reports-py${{ matrix.python-version }}
          path: pylint-reports/
          retention-days: 30

  lint-summary:
    name: 'Lint Summary'
    runs-on: ubuntu-latest
    needs: [lint]
    if: always()
    steps:
      - name: Check lint status
        run: |
          echo "## Lint Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.lint.result }}" = "success" ]; then
            echo "✅ All linting checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Linting checks failed" >> $GITHUB_STEP_SUMMARY
          fi
