name: Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/generative-ai-hub-sdk/**'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/generative-ai-hub-sdk/**'
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-pr:
    name: PR Title Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    steps:
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          subjectPattern: ^[A-Z].+$
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build

  lint:
    name: 'Linter - Python ${{ matrix.python-version }}'
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request_target'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        working-directory: packages/generative-ai-hub-sdk
        run: uv sync --all-extras

      - name: Run pylint
        working-directory: packages/generative-ai-hub-sdk
        run: |
          mkdir -p pylint-reports
          uv run pylint gen_ai_hub \
            --errors-only \
            --output-format=json \
            > pylint-reports/pylint-py${{ matrix.python-version }}.json
          uv run pylint gen_ai_hub \
            --errors-only \
            --output-format=colorized

      - name: Upload pylint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pylint-reports-py${{ matrix.python-version }}
          path: packages/generative-ai-hub-sdk/pylint-reports/
          retention-days: 30

  lint-summary:
    name: 'Lint Summary'
    runs-on: ubuntu-latest
    needs: [lint]
    if: always() && github.event_name != 'pull_request_target'
    steps:
      - name: Check lint status
        run: |
          echo "## Lint Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.lint.result }}" = "success" ]; then
            echo "✅ All linting checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Linting checks failed" >> $GITHUB_STEP_SUMMARY
          fi
