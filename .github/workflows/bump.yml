name: bump

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to bump'
        required: true
        type: choice
        options:
          - base
          - core
          - gen

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SAP_AI_SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SAP_AI_SDK_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Setup
        uses: SAP/ai-sdk-python/.github/actions/setup@main
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --local user.email "${{ vars.SAP_AI_SDK_BOT_EMAIL }}"
          git config --local user.name "${{ vars.SAP_AI_SDK_BOT_NAME }}"

      - name: Bump versions and generate changelogs
        working-directory: packages/${{ env.PACKAGE }}
        run: uv run cz bump --changelog --files-only

      - name: Update lockfile
        run: uv lock

      - name: Commit and tag
        working-directory: packages/${{ env.PACKAGE }}
        run: |
          VERSION=$(uv run cz version --project)
          git add -u
          git commit -m "bump: $PACKAGE-v${VERSION}"
          git tag "$PACKAGE-v${VERSION}"

      - name: Push
        working-directory: packages/${{ env.PACKAGE }}
        run: |
          VERSION=$(uv run cz version --project)
          git push origin main
          git push origin "$PACKAGE-v${VERSION}"
