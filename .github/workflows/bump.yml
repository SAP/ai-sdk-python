name: bump

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to bump'
        required: true
        type: choice
        options:
          - base
          - core
          - gen
      bump-type:
        description: 'Increment the minor (X.Y+1.0) or patch (X.Y.Z+1) version component based on the current version.txt'
        required: true
        type: choice
        options:
          # - major we should be careful with that
          - minor
          - patch

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.SAP_AI_SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SAP_AI_SDK_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --local user.email "${{ vars.SAP_AI_SDK_BOT_EMAIL }}"
          git config --local user.name "${{ vars.SAP_AI_SDK_BOT_NAME }}"

      - name: Bump
        id: bump
        working-directory: packages/${{ inputs.package }}
        run: |
          uvx bump-my-version bump ${{ inputs.bump-type }}
          echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: Check release notes
        if: inputs.package == 'gen'
        run: |
          if ! grep -qF "## ${{ steps.bump.outputs.version }}" packages/gen/RELEASE_NOTES.md; then
            echo "RELEASE_NOTES.md does not contain an entry for version ${{ steps.bump.outputs.version }}"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Generate changelog from commits
        working-directory: packages/${{ inputs.package }}
        run: |
          python scripts/generate_changelog.py "${{ steps.bump.outputs.version }}" --update

      - name: Commit
        run: |
          git add packages/${{ inputs.package }}/version.txt
          git commit -m "chore: bump ${{ inputs.package }} version to ${{ steps.bump.outputs.version }}"
          git push origin main

      - name: Tag
        run: |
          git tag -a "${{ inputs.package }}-v${{ steps.bump.outputs.version }}" -m "Release ${{ inputs.package }} v${{ steps.bump.outputs.version }}"
          git push origin "${{ inputs.package }}-v${{ steps.bump.outputs.version }}"
