name: publish-testpypi

on:
  release:
    types: [published]

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get package from tag
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE="${TAG%%-v*}"
          echo "package=${PACKAGE}" >> "$GITHUB_OUTPUT"

      - name: Setup
        uses: SAP/ai-sdk-python/.github/actions/setup@os-migration
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build package
        run: |
          uv build --package sap-ai-sdk-${{ steps.meta.outputs.package }} --out-dir packages/${{ steps.meta.outputs.package }}/dist

      - name: Upload distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: packages/${{ steps.meta.outputs.package }}/dist/

  publish-pypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: false
          packages-dir: dist/
