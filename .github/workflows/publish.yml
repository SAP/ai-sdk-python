name: publish-testpypi

on:
  release:
    types: [published]

jobs:
  sync-changelog:
    name: Write release notes back to RELEASE_NOTES.md
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.SAP_AI_SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SAP_AI_SDK_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Get package and version from tag
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE="${TAG%%-v*}"
          VERSION="${TAG#${PACKAGE}-v}"
          echo "package=${PACKAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update RELEASE_NOTES.md
        env:
          BODY: ${{ github.event.release.body }}
          PACKAGE: ${{ steps.meta.outputs.package }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 .github/scripts/update_changelog.py \
            "$PACKAGE" \
            "$VERSION" \
            "$BODY"

      - name: Configure git
        env:
          BOT_EMAIL: ${{ vars.SAP_AI_SDK_BOT_EMAIL }}
          BOT_NAME: ${{ vars.SAP_AI_SDK_BOT_NAME }}
        run: |
          git config --local user.email "$BOT_EMAIL"
          git config --local user.name "$BOT_NAME"

      - name: Commit and push
        env:
          TAG: ${{ github.event.release.tag_name }}
          PACKAGE: ${{ steps.meta.outputs.package }}
        run: |
          git add "packages/${PACKAGE}/RELEASE_NOTES.md"
          git diff --cached --quiet || git commit -m "docs: sync release notes for ${TAG} [skip ci]"
          git push origin main

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: sync-changelog
    permissions:
      contents: read
    steps:
      - name: Get package from tag
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE="${TAG%%-v*}"
          echo "package=${PACKAGE}" >> "$GITHUB_OUTPUT"

      - name: Setup
        uses: SAP/ai-sdk-python/.github/actions/setup@main
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build package
        env:
          PACKAGE: ${{ steps.meta.outputs.package }}
        run: |
          uv build --package sap-ai-sdk-$PACKAGE --out-dir packages/$PACKAGE/dist

      - name: Upload distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: packages/${{ steps.meta.outputs.package }}/dist/

  publish-pypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: false
          packages-dir: dist/
