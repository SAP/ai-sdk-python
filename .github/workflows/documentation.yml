name: documentation

on:
  push:
    tags:
      - 'base-v*'
      - 'core-v*'
      - 'gen-v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Determine package from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          PACKAGE="${TAG%%-v*}"
          echo "package=${PACKAGE}" >> "$GITHUB_OUTPUT"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          ref: ${{ github.ref_name }}

      - name: Make HTML
        working-directory: packages/${{ steps.meta.outputs.package }}/docs
        run: uv run make

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ github.ref_name }}
          path: packages/${{ steps.meta.outputs.package }}/docs/build/html
