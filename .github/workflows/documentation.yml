name: documentation

on:
  push:
    tags:
      - 'base-v*'
      - 'core-v*'
      - 'gen-v*'

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Determine package from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          PACKAGE="${TAG%%-v*}"
          echo "package=${PACKAGE}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Make HTML
        working-directory: packages/${{ steps.meta.outputs.package }}/docs
        run: uv run make

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ github.ref_name }}
          path: packages/${{ steps.meta.outputs.package }}/docs/build/html
