name: documentation

on:
  push:
    tags:
      - 'gen-v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Setup
        uses: SAP/ai-sdk-python/.github/actions/setup@7c4e0ae0f4c548da7a8fd5a630ba849ec38296c6 # main
        with:
          ref: ${{ github.ref_name }}

      - name: Make HTML
        working-directory: packages/gen/docs
        run: uv run make

      - name: Upload documentation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-${{ github.ref_name }}
          path: packages/gen/docs/build/html
