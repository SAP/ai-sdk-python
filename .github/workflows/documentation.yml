name: documentation

on:
  push:
    tags:
      - 'gen-v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Setup
        uses: SAP/ai-sdk-python/.github/actions/setup@2342cf3092145d0c5aebbcd1a4e7f3eed8033a66 # main
        with:
          ref: ${{ github.ref_name }}

      - name: Make HTML
        working-directory: packages/gen/docs
        run: uv run make

      - name: Upload documentation artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-${{ github.ref_name }}
          path: packages/gen/docs/build/html
