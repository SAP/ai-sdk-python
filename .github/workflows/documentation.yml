name: documentation

on:
  push:
    tags:
      - 'gen-v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Setup
        uses: SAP/ai-sdk-python/.github/actions/setup@os-migration
        with:
          ref: ${{ github.ref_name }}

      - name: Make HTML
        working-directory: packages/gen/docs
        run: uv run make

      - name: Upload documentation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-${{ github.ref_name }}
          path: packages/gen/docs/build/html
