name: Tests

on:
  workflow_dispatch:
  schedule:
    # Run tests weekly on Monday at 22:00 UTC
    - cron: '0 22 * * 1'
  push:
    branches:
      - main
      - monorepo-uv
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: 'Unit Tests - ${{ matrix.package.name }} - Python ${{ matrix.python-version }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
        package:
          - name: ai-api-client-sdk
            path: packages/ai-api-client-sdk/tests
            source: packages/ai-api-client-sdk/ai_api_client_sdk
          - name: ai-core-sdk
            path: packages/ai-core-sdk/tests
            source: packages/ai-core-sdk/ai_core_sdk
          - name: generative-ai-hub-sdk
            path: packages/generative-ai-hub-sdk/tests
            source: packages/generative-ai-hub-sdk/gen_ai_hub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Run unit tests with coverage
        id: run-tests
        run: |
          mkdir -p test-results
          uv run pytest ${{ matrix.package.path }} \
            --cov=${{ matrix.package.source }} \
            --cov-report xml:test-results/coverage.xml \
            --junit-xml=test-results/unit-tests.xml \
            --verbosity=2 \
            -ra \
            --disable-warnings

      - name: Upload coverage reports
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.package.name }}-py${{ matrix.python-version }}
          path: test-results/
          retention-days: 30

      - name: Summarize results
        if: always()
        run: |
          echo "${{ steps.run-tests.outcome == 'success' && '✅ passed' || '❌ failed' }} [test results](${{ steps.upload.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY

  integration-tests:
    name: 'Integration Tests - Python ${{ matrix.python-version }}'
    runs-on: ubuntu-latest
    # Only run integration tests if credentials are available (not on external PRs)
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Run integration tests
        id: run-tests
        env:
          AICORE_RESOURCE_GROUP: ${{ secrets.AICORE_RESOURCE_GROUP }}
          AICORE_BASE_URL: ${{ secrets.AICORE_BASE_URL }}
          AICORE_AUTH_URL: ${{ secrets.AICORE_AUTH_URL }}
          AICORE_CLIENT_ID: ${{ secrets.AICORE_CLIENT_ID }}
          AICORE_CLIENT_SECRET: ${{ secrets.AICORE_CLIENT_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p test-results
          uv run pytest -c pytest-integration.toml \
            --cov \
            --junit-xml=test-results/integration-tests.xml \
            --cov-report xml:test-results/integration-coverage.xml \
            --verbosity=2 \
            -ra \
            --disable-warnings \
            -m "not bedrock"
      - name: Upload integration test results
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-py${{ matrix.python-version }}
          path: test-results/
          retention-days: 30

      - name: Summarize results
        if: always()
        run: |
          echo "${{ steps.run-tests.outcome == 'success' && '✅ passed' || '❌ failed' }} [test results](${{ steps.upload.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
