name: Tests

on:
  workflow_dispatch:
  schedule:
    # Run tests weekly on Monday at 22:00 UTC
    - cron: '0 22 * * 1'
  push:
    branches:
      - main
      - monorepo-uv
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: 'Unit Tests - ${{ matrix.package }} - Python ${{ matrix.python-version }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
        package:
          - name: ai-api-client-sdk
            path: packages/ai-api-client-sdk/tests
            source: packages/ai-api-client-sdk/ai_api_client_sdk
          - name: ai-core-sdk
            path: packages/ai-core-sdk/tests
            source: packages/ai-core-sdk/ai_core_sdk
          - name: generative-ai-hub-sdk
            path: packages/generative-ai-hub-sdk/tests
            source: packages/generative-ai-hub-sdk/gen_ai_hub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests with coverage
        run: |
          mkdir -p test-results
          uv run pytest ${{ matrix.package.path }} \
            --cov=${{ matrix.package.source }} \
            --cov-report xml:test-results/coverage.xml \
            --junit-xml=test-results/unit-tests.xml \
            --verbosity=2 \
            -ra \
            --disable-warnings

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.package.name }}-py${{ matrix.python-version }}
          path: test-results/
          retention-days: 30

  integration-tests:
    name: 'Integration Tests - Python ${{ matrix.python-version }}'
    runs-on: ubuntu-latest
    # Only run integration tests if credentials are available (not on external PRs)
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run integration tests
        env:
          AICORE_RESOURCE_GROUP: ${{ secrets.AICORE_RESOURCE_GROUP }}
          AICORE_BASE_URL: ${{ secrets.AICORE_BASE_URL }}
          AICORE_AUTH_URL: ${{ secrets.AICORE_AUTH_URL }}
          AICORE_CLIENT_ID: ${{ secrets.AICORE_CLIENT_ID }}
          AICORE_CLIENT_SECRET: ${{ secrets.AICORE_CLIENT_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p test-results
          uv run pytest -c pytest-integration.toml \
            --cov \
            --junit-xml=test-results/integration-tests.xml \
            --cov-report xml:test-results/integration-coverage.xml \
            --verbosity=2 \
            -ra \
            --disable-warnings \
            -m "not bedrock" || true

      - name: Check integration test failure rate
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          report_path = "test-results/integration-tests.xml"
          max_failure_rate = 0.10

          try:
            root = ET.parse(report_path).getroot()
          except FileNotFoundError:
            print(f"ERROR: Missing JUnit report: {report_path}")
            sys.exit(1)

          def to_int(value):
            if value is None:
              return 0
            try:
              return int(float(value))
            except ValueError:
              return 0

          if root.tag == "testsuites":
            suites = root.findall("testsuite")
            tests = sum(to_int(s.attrib.get("tests")) for s in suites)
            failures = sum(to_int(s.attrib.get("failures")) for s in suites)
            errors = sum(to_int(s.attrib.get("errors")) for s in suites)
            skipped = sum(to_int(s.attrib.get("skipped")) for s in suites)
          elif root.tag == "testsuite":
            tests = to_int(root.attrib.get("tests"))
            failures = to_int(root.attrib.get("failures"))
            errors = to_int(root.attrib.get("errors"))
            skipped = to_int(root.attrib.get("skipped"))
          else:
            print(f"ERROR: Unsupported JUnit root tag: {root.tag}")
            sys.exit(1)

          failed = failures + errors
          executed = max(0, tests - skipped)

          if executed == 0:
            print("ERROR: No executed non-bedrock integration tests found.")
            sys.exit(1)

          failure_rate = failed / executed
          summary = (
            f"Executed={executed}, Failed={failed} (failures={failures}, errors={errors}), "
            f"Skipped={skipped}, FailureRate={failure_rate:.2%}, Threshold={max_failure_rate:.2%}"
          )

          if failure_rate > max_failure_rate:
            print(f"FAIL: {summary}")
            sys.exit(1)

          if failed > 0:
            print(f"WARNING: {summary}")
          else:
            print(f"PASS: {summary}")
          PY

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-py${{ matrix.python-version }}
          path: test-results/
          retention-days: 30

  test-results:
    name: 'Publish Test Results'
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: always()
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-test-results

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/unit-tests-*.xml'
          check_name: 'Test Results'

      - name: Comment on PR with test summary
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          coverage_info=""
          for dir in all-test-results/*/; do
            [ -f "${dir}coverage.xml" ] && coverage_info+="✅ Coverage report available in artifacts: $(basename "$dir")\n"
          done

          gh pr comment "${{ github.event.pull_request.number }}" --body "$(printf "## Test Results Summary\n\n%s" "${coverage_info:-No coverage reports found}")"
