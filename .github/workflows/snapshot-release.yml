name: snapshot-release

on:
  push:
    branches:
      - main
      - os-migration

jobs:
  snapshot-release:
    runs-on: ubuntu-latest
    env:
      UV_INDEX_ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      UV_INDEX_ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_TOKEN }}
    steps:
      - uses: SAP/ai-sdk-python/.github/actions/setup@os-migration
        with:
          fetch-depth: 0
          index-username: ${{ secrets.ARTIFACTORY_USERNAME }}
          index-token: ${{ secrets.ARTIFACTORY_TOKEN }}

      - name: Bump versions
        run: |
          bump() (
            local pkg=$1
            echo "Bumping $pkg..."
            cd packages/$pkg
            uv run cz bump --version-files-only --prerelease alpha && code=0 || code=$?
            # exit code 3 = NO_COMMITS_FOUND; fall back to patch bump
            if [ $code -eq 3 ]; then
              echo "No commits found for $pkg, falling back to patch bump..."
              uv run cz bump --version-files-only --prerelease alpha --increment PATCH
            elif [ $code -ne 0 ]; then
              echo "cz bump failed for $pkg with exit code $code"
              exit $code
            fi
            echo "Applying timestamp suffix for $pkg..."
            sed -i "s/a0\"/a$(date +%s)\"/" pyproject.toml
            echo "$pkg version: $(uv run cz version --project)"
          )

          bump base
          version=$(cd packages/base && uv run cz version --project)
          sed -i "s/sap-ai-sdk-base~=[^ ,\"]*/sap-ai-sdk-base==$version/" packages/core/pyproject.toml
          echo "Pinned sap-ai-sdk-base==$version in core"

          bump core
          version=$(cd packages/core && uv run cz version --project)
          sed -i "s/sap-ai-sdk-core>=[^ ,\"]*/sap-ai-sdk-core==$version/" packages/gen/pyproject.toml
          echo "Pinned sap-ai-sdk-core==$version in gen"

          bump gen

      - name: Build base
        run: uv build --package sap-ai-sdk-base --out-dir packages/base/dist

      - name: Build core
        run: uv build --package sap-ai-sdk-core --out-dir packages/core/dist

      - name: Build gen
        run: uv build --package sap-ai-sdk-gen --out-dir packages/gen/dist

