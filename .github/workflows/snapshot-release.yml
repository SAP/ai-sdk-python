name: snapshot-release

on:
  # schedule:
  #   - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  snapshot-release:
    runs-on: ubuntu-latest
    concurrency:
      group: snapshot-release-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
    env:
      UV_INDEX_ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      UV_INDEX_ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_TOKEN }}

    steps:
      - uses: SAP/ai-sdk-python/.github/actions/setup@main
        with:
          fetch-depth: 0
          index-username: ${{ secrets.ARTIFACTORY_USERNAME }}
          index-token: ${{ secrets.ARTIFACTORY_TOKEN }}

      - name: Bump versions
        run: |
          now=$(date +%s)

          bump() (
            local pkg=$1

            echo "Bumping $pkg..."
            cd packages/$pkg
            local old_version; old_version=$(uv run cz version --project)
            uv run cz bump --version-files-only --prerelease alpha && code=0 || code=$?

            # exit code 3 = NO_COMMITS_FOUND; fall back to patch bump
            if [ $code -eq 3 ]; then
              echo "No commits found for $pkg, falling back to patch bump..."
              uv run cz bump --version-files-only --prerelease alpha --increment PATCH
            elif [ $code -ne 0 ]; then
              echo "cz bump failed for $pkg with exit code $code"
              exit $code
            fi

            # Replace the a0 pre-release suffix with a timestamp to ensure uniqueness
            sed -i "s/a0\"/a${now}\"/" pyproject.toml

            local version; version=$(uv run cz version --project)
            echo "$pkg version: $old_version -> $version"
            echo "- **sap-ai-sdk-${pkg}**: \`${old_version}\` → \`${version}\`" >> "$GITHUB_STEP_SUMMARY"
          )

          pin_dep() (
            local short=$1 target=$2
            local pkg="sap-ai-sdk-${short}"
            local version; version=$(uv run --directory packages/$short cz version --project)
            local project_toml="packages/${target}/pyproject.toml"

            # Replace any ~= or >= version constraint with an exact pin
            sed -i "s/${pkg}[~>]=[^ ,\"]*/${pkg}==${version}/" "$project_toml"
            echo "Pinned ${pkg}==${version} in ${target}"
          )

          bump base
          pin_dep base core

          bump core
          pin_dep core gen

          bump gen

      - name: Build packages
        run: |
          for pkg in base core gen; do
            uv build --package sap-ai-sdk-$pkg --out-dir packages/$pkg/dist
          done

      # - name: Release packages
      #   run: |
      #     for pkg in base core gen; do
      #       uv publish packages/$pkg/dist/
      #     done
