name: snapshot-release

on:
  push:
    branches:
      - main
      - os-migration

jobs:
  snapshot-release:
    runs-on: ubuntu-latest
    env:
      UV_INDEX_ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      UV_INDEX_ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_TOKEN }}
    steps:
      - uses: SAP/ai-sdk-python/.github/actions/setup@os-migration
        with:
          fetch-depth: 0
          index-username: ${{ secrets.ARTIFACTORY_USERNAME }}
          index-token: ${{ secrets.ARTIFACTORY_TOKEN }}

      - name: Bump versions
        run: |
          bump() (
            local pkg=$1

            echo "Bumping $pkg..."
            cd packages/$pkg
            uv run cz bump --version-files-only --prerelease alpha && code=0 || code=$?

            # exit code 3 = NO_COMMITS_FOUND; fall back to patch bump
            if [ $code -eq 3 ]; then
              echo "No commits found for $pkg, falling back to patch bump..."
              uv run cz bump --version-files-only --prerelease alpha --increment PATCH
            elif [ $code -ne 0 ]; then
              echo "cz bump failed for $pkg with exit code $code"
              exit $code
            fi

            # Replace the a0 pre-release suffix with a timestamp to ensure uniqueness
            local ts; ts=$(date +%s)
            sed -i "s/a0\"/a${ts}\"/" pyproject.toml

            echo "$pkg version: $(uv run cz version --project)"
          )

          pin_dep() (
            local short=$1 target=$2
            local pkg="sap-ai-sdk-${short}"
            local version; version=$(uv run --directory packages/$short cz version --project)
            local project_toml="packages/${target}/pyproject.toml"

            # Replace any ~= or >= version constraint with an exact pin
            sed -i "s/${pkg}[~>]=[^ ,\"]*/${pkg}==${version}/" "$project_toml"
            echo "Pinned ${pkg}==${version} in ${target}"
          )

          bump base
          pin_dep base core

          bump core
          pin_dep core gen

          bump gen


