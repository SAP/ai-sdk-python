      #     sed -i "s/sap-ai-sdk-base~=[^ ,\"]*/sap-ai-sdk-base==$(cd packages/base && uv run --no-sync cz version --project)/" packages/core/pyproject.toml
      #
      #     bump core
      #     sed -i "s/sap-ai-sdk-core>=[^ ,\"]*/sap-ai-sdk-core==$(cd packages/core && uv run --no-sync cz version --project)/" packages/gen/pyproject.toml
      #
      #     bump gen

      - name: Bump base version
        working-directory: packages/base
        run: |
          uv run --no-sync cz bump --version-files-only --prerelease alpha && code=0 || code=$?
          # exit code 3 = NO_COMMITS_FOUND; fall back to patch bump
          if [ $code -eq 3 ]; then
            uv run --no-sync cz bump --version-files-only --prerelease alpha --increment PATCH
          elif [ $code -ne 0 ]; then
            exit $code
          fi
          sed -i "s/a0\"/a$(date +%s)\"/" pyproject.toml
          version=$(uv run --no-sync cz version --project)
          echo version
          sed -i "s/sap-ai-sdk-base~=[^ ,\"]*/sap-ai-sdk-base==$version/" ../core/pyproject.toml

          echo pyproject.toml
          cat pyproject.toml

          echo ../core/pyproject.toml
          cat ../core/pyproject.toml

      - name: Bump core version
        working-directory: packages/core
        run: |
          uv run --no-sync cz bump --version-files-only --prerelease alpha && code=0 || code=$?
          # exit code 3 = NO_COMMITS_FOUND; fall back to patch bump
          if [ $code -eq 3 ]; then
            uv run --no-sync cz bump --version-files-only --prerelease alpha --increment PATCH
          elif [ $code -ne 0 ]; then
            exit $code
          fi
          sed -i "s/a0\"/a$(date +%s)\"/" pyproject.toml
          version=$(uv run --no-sync cz version --project)
          sed -i "s/sap-ai-sdk-core>=[^ ,\"]*/sap-ai-sdk-core==$version/" ../gen/pyproject.toml

      - name: Bump gen version
        working-directory: packages/gen
        run: |
          uv run --no-sync cz bump --version-files-only --prerelease alpha && code=0 || code=$?
          # exit code 3 = NO_COMMITS_FOUND; fall back to patch bump
          if [ $code -eq 3 ]; then
            uv run --no-sync cz bump --version-files-only --prerelease alpha --increment PATCH
          elif [ $code -ne 0 ]; then
            exit $code
          fi
          sed -i "s/a0\"/a$(date +%s)\"/" pyproject.toml

      - name: Build base
        run: uv build --package sap-ai-sdk-base --out-dir packages/base/dist

      - name: Build core
        run: uv build --package sap-ai-sdk-core --out-dir packages/core/dist

      - name: Build gen
        run: uv build --package sap-ai-sdk-gen --out-dir packages/gen/dist

