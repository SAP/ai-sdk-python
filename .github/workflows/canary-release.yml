name: canary-release

on:
  push:
    branches:
      - main

jobs:
  canary-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [base, core, gen]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Detect changes since last release
        id: detect
        run: |
          if ! git diff --quiet HEAD~1..HEAD -- packages/${{ matrix.package }}/; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        if: steps.detect.outputs.changed == 'true'
        working-directory: packages/${{ matrix.package }}
        run: uv run cz bump --files-only

      - name: Build
        if: steps.detect.outputs.changed == 'true'
        run: uv build --package sap-ai-sdk-${{ matrix.package }} --out-dir packages/${{ matrix.package }}/dist

      - name: Release to Artifactory #(TODO: currently not working)
        if: steps.detect.outputs.changed == 'true'
        working-directory: packages/${{ matrix.package }}
        run: |
          VERSION=$(uv run cz version --project)
          uv publish \
            --index-url https://common.repositories.cloud.sap/artifactory/api/pypi/build.snapshots.pypi/legacy/ \
            --username ${{ secrets.ARTIFACTORY_USERNAME }} \ # TODO: use separate credentials for internal artifactory
            --password ${{ secrets.ARTIFACTORY_TOKEN }} \ # TODO: use separate credentials for internal artifactory
            dist/
