name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/generative-ai-hub-sdk/**'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/generative-ai-hub-sdk/**'

jobs:
  build:
    name: 'Build Distribution - Python ${{ matrix.python-version }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install build tools
        run: pip install build

      - name: Install dependencies
        working-directory: packages/generative-ai-hub-sdk
        run: uv sync --extra all

      - name: Check syntax with Python compiler
        working-directory: packages/generative-ai-hub-sdk
        run: |
          python -m compileall -q gen_ai_hub/

      - name: Build distribution packages
        working-directory: packages/generative-ai-hub-sdk
        run: |
          python -m build

      - name: List generated artifacts
        working-directory: packages/generative-ai-hub-sdk
        run: |
          ls -la dist/
          echo "=== Wheel File ==="
          find dist/ -name "*.whl" -exec python -m zipfile -l {} \;

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts-py${{ matrix.python-version }}
          path: packages/generative-ai-hub-sdk/dist/
          retention-days: 30

  build-summary:
    name: 'Build Summary'
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-artifacts

      - name: Check build status
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Generated:" >> $GITHUB_STEP_SUMMARY
          find all-artifacts -name "*.whl" -o -name "*.tar.gz" | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All artifacts available for download." >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR with build results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let artifacts_info = '';
            const artifact_dirs = fs.readdirSync('all-artifacts');

            for (const dir of artifact_dirs) {
              if (dir.includes('build-artifacts')) {
                const build_path = path.join('all-artifacts', dir);
                const files = fs.readdirSync(build_path).filter(f => f.endsWith('.whl') || f.endsWith('.tar.gz'));
                if (files.length > 0) {
                  artifacts_info += `**${dir}:**\n`;
                  files.forEach(f => artifacts_info += `- ${f}\n`);
                }
              }
            }

            const status = '${{ needs.build.result }}' === 'success' ? '✅' : '❌';
            const comment = `## Build Status ${status}\n\n${status === '✅' ? 'Distribution packages built successfully.' : 'Build failed. Please check the logs.'}\n\n### Generated Artifacts:\n${artifacts_info || 'See artifacts in Actions'}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
