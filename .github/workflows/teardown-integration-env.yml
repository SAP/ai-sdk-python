name: teardown-integration-env

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  teardown:
    runs-on: ubuntu-latest
    steps:
      - uses: SAP/ai-sdk-python/.github/actions/setup@2342cf3092145d0c5aebbcd1a4e7f3eed8033a66 # main

      - name: Tear down integration test environment
        run: bash scripts/teardown-integration-env.sh
