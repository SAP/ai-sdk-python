name: teardown-integration-env

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  teardown:
    runs-on: ubuntu-latest
    steps:
      - uses: SAP/ai-sdk-python/.github/actions/setup@1bad6c8a89d8f1f8e3f1d4ee27ce93df9c23cdfa # main

      - name: Tear down integration test environment
        run: bash scripts/teardown-integration-env.sh
