[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-ai-sdk-prompt-registry"
version = "1.0.0"
description = "SAP Cloud SDK for AI (Python): generative AI hub prompt registry client"
readme = "PYPIDESCRIPTION.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SAP SE" }]
keywords = ["SAP AI Core", "SAP generative AI SDK", "SAP Generative AI Hub", "Prompt Registry"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "sap-ai-sdk-proxy>=1.0.0",
    "sap-ai-sdk-orchestration>=1.0.0",
    "pydantic~=2.12",
]

[project.urls]
Homepage = "https://www.sap.com/"
Download = "https://pypi.python.org/pypi/sap-ai-sdk-prompt-registry"

[tool.uv.sources]
sap-ai-sdk-proxy = { workspace = true }
sap-ai-sdk-orchestration = { workspace = true }

[tool.pytest.ini_options]
env_files = [".env"]

[tool.setuptools.packages.find]
exclude = ["*test*"]
namespaces = true

[tool.commitizen]
name = "cz_customize"
tag_format = "prompt-registry-v${version}"
ignored_tag_formats = ["*-v${version}"]
version_provider = "pep621"
changelog_file = "RELEASE_NOTES.md"

[tool.commitizen.customize]
bump_pattern = '^(feat|fix)\(prompt_registry\)'
changelog_pattern = '^(feat|fix)\(prompt_registry\)'
