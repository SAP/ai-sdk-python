[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-ai-sdk-base"
version = "3.4.0"
description = "SAP Cloud SDK for AI (Python): Base Client"
readme = "PYPIDESCRIPTION.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SAP SE" }]
keywords = ["SAP AI Core"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = ["aenum~=3.1", "pyhumps~=3.0", "requests~=2.32"]

[dependency-groups]
dev = ["pytest==9.0.3", "pytest-cov==7.1.0", "pylint==4.0.5", "pytest-dotenv>=0.5.2"]

[tool.pytest.ini_options]
env_files = [".env"]

[project.urls]
Homepage = "https://www.sap.com/"
Download = "https://pypi.python.org/pypi/sap-ai-sdk-base"

[tool.setuptools.packages.find]
exclude = ["*test*"]

[tool.commitizen]
tag_format = "base-v$version"
version_provider = "pep621"
changelog_file = "RELEASE_NOTES.md"
update_changelog_on_bump = true
bump_pattern = '^(BREAKING CHANGE|feat|fix|refactor|perf)\(base\)(!)?:'
changelog_pattern = '^(BREAKING CHANGE|feat|fix|refactor|perf)\(base\)(!)?:'
