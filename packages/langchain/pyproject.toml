[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-ai-sdk-langchain"
version = "1.0.0"
description = "SAP Cloud SDK for AI (Python): LangChain integration for generative AI hub"
readme = "PYPIDESCRIPTION.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SAP SE" }]
keywords = ["SAP AI Core", "SAP generative AI SDK", "SAP Generative AI Hub", "LangChain"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "sap-ai-sdk-proxy>=1.0.0",
    "langchain~=1.4.0",
    "langchain-classic~=1.0.0",
    "packaging>=23.2",
    "pydantic~=2.12",
]

[project.optional-dependencies]
openai = [
    "sap-ai-sdk-openai>=1.0.0",
    "langchain-openai~=1.6.0",
]
amazon = [
    "sap-ai-sdk-amazon>=1.0.0",
    "langchain-aws~=1.7.0",
]
google = [
    "sap-ai-sdk-google>=1.0.0",
    "langchain-google-genai~=4.4.0",
]
all = [
    "sap-ai-sdk-langchain[openai,amazon,google]",
]

[project.urls]
Homepage = "https://www.sap.com/"
Download = "https://pypi.python.org/pypi/sap-ai-sdk-langchain"

[tool.uv.sources]
sap-ai-sdk-proxy = { workspace = true }
sap-ai-sdk-openai = { workspace = true }
sap-ai-sdk-amazon = { workspace = true }
sap-ai-sdk-google = { workspace = true }

[tool.pytest.ini_options]
env_files = [".env"]

[tool.setuptools.packages.find]
exclude = ["*test*"]
namespaces = true

[tool.commitizen]
name = "cz_customize"
tag_format = "langchain-v${version}"
ignored_tag_formats = ["*-v${version}"]
version_provider = "pep621"
changelog_file = "RELEASE_NOTES.md"

[tool.commitizen.customize]
bump_pattern = '^(feat|fix)\(langchain\)'
changelog_pattern = '^(feat|fix)\(langchain\)'
