name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # replace with your default branch name if it's not 'main'

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./docs/requirements.txt
          pip install -r requirements.txt --index-url https://int.repositories.cloud.sap/artifactory/api/pypi/build-snapshots-pypi/simple --trusted-host int.repositories.cloud.sap

      - name: Make HTML
        run: |
          cd docs
          make

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html