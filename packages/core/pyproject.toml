[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-ai-sdk-core"
version = "3.3.1"
description = "SAP Cloud SDK for AI (Python): Core SDK"
readme = "PYPIDESCRIPTION.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SAP SE" }]
keywords = ["SAP AI Core", "SAP AI Core API"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = ["sap-ai-sdk-base~=3.4", "click~=8.3"]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pylint==4.0.5",
    "pyhamcrest==2.1.0",
    "pytest-dotenv>=0.5.2",
]
docs = [
    "sphinx<9.0.0",
    "sphinxawesome-theme",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["integration_tests"]

[project.scripts]
aicore = "ai_core_sdk.cli:cli"

[project.urls]
Homepage = "https://www.sap.com/"
Download = "https://pypi.python.org/pypi/sap-ai-sdk-core"

[tool.uv.sources]
sap-ai-sdk-base = { workspace = true }

[tool.setuptools.packages.find]
exclude = ["*test*"]

[tool.commitizen]
name = "cz_customize"
tag_format = "core-v${version}"
ignored_tag_formats = ["*-v${version}"]
version_provider = "pep621"
changelog_file = "RELEASE_NOTES.md"

[tool.commitizen.customize]
bump_pattern = '^(feat|fix)\(core\)'
changelog_pattern = '^(feat|fix)\(core\)'
