[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-kiota-generator"
version = "0.1.0"
description = "SAP Cloud SDK for AI (Python): Kiota-based OpenAPI code generation tooling"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SAP SE" }]
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "sap-openapi-generator>=0.1.0",
]

[project.scripts]
sap-kiota-generate = "sap_kiota_generator.generate:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
sap-openapi-generator = { workspace = true }
