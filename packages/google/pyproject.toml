[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-ai-sdk-google"
version = "1.0.0"
description = "SAP Cloud SDK for AI (Python): Google GenAI provider for generative AI hub"
readme = "PYPIDESCRIPTION.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SAP SE" }]
keywords = ["SAP AI Core", "SAP generative AI SDK", "SAP Generative AI Hub", "Google GenAI"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "sap-ai-sdk-proxy>=1.0.0",
    "google-genai~=2.23.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
langchain = [
    "langchain~=1.4.0",
    "langchain-classic~=1.0.0",
    "langchain-google-genai~=4.4.0",
]

[project.urls]
Homepage = "https://www.sap.com/"
Download = "https://pypi.python.org/pypi/sap-ai-sdk-google"

[tool.uv.sources]
sap-ai-sdk-proxy = { workspace = true }

[tool.pytest.ini_options]
env_files = [".env"]

[tool.setuptools.packages.find]
exclude = ["*test*"]
namespaces = true

[tool.commitizen]
name = "cz_customize"
tag_format = "google-v${version}"
ignored_tag_formats = ["*-v${version}"]
version_provider = "pep621"
changelog_file = "RELEASE_NOTES.md"

[tool.commitizen.customize]
bump_pattern = '^(feat|fix)\(google\)'
changelog_pattern = '^(feat|fix)\(google\)'
