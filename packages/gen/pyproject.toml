[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-ai-sdk-gen"
version = "1.0.0"
description = "SAP Cloud SDK for AI (Python): compatibility meta package restoring the gen_ai_hub.* imports"
readme = "PYPIDESCRIPTION.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SAP SE" }]
keywords = ["SAP AI Core", "SAP generative AI SDK", "SAP Generative AI Hub"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "sap-ai-sdk-proxy>=1.0.0",
    "sap-ai-sdk-openai>=1.0.0",
    "sap-ai-sdk-rpt>=1.0.0",
    "sap-ai-sdk-orchestration>=1.0.0",
    "sap-ai-sdk-prompt-registry>=1.0.0",
    "sap-ai-sdk-document-grounding>=1.0.0",
    "sap-ai-sdk-batch>=1.0.0",
    "sap-ai-sdk-evaluations>=1.0.0",
]

[project.optional-dependencies]
langchain = ["sap-ai-sdk-langchain>=1.0.0"]
amazon = ["sap-ai-sdk-amazon>=1.0.0"]
google = ["sap-ai-sdk-google>=1.0.0"]
all = ["sap-ai-sdk-gen[langchain,amazon,google]"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pylint==4.0.8",
    "pytest-dotenv>=0.5.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["integration_tests"]

[project.urls]
Homepage = "https://www.sap.com/"
Download = "https://pypi.python.org/pypi/sap-ai-sdk-gen"

[tool.uv.sources]
sap-ai-sdk-proxy = { workspace = true }
sap-ai-sdk-openai = { workspace = true }
sap-ai-sdk-rpt = { workspace = true }
sap-ai-sdk-orchestration = { workspace = true }
sap-ai-sdk-prompt-registry = { workspace = true }
sap-ai-sdk-document-grounding = { workspace = true }
sap-ai-sdk-batch = { workspace = true }
sap-ai-sdk-evaluations = { workspace = true }
sap-ai-sdk-langchain = { workspace = true }
sap-ai-sdk-amazon = { workspace = true }
sap-ai-sdk-google = { workspace = true }

[tool.setuptools.packages.find]
exclude = ["*test*"]

[tool.commitizen]
name = "cz_customize"
tag_format = "gen-v${version}"
ignored_tag_formats = ["*-v${version}"]
version_provider = "pep621"
changelog_file = "RELEASE_NOTES.md"

[tool.commitizen.customize]
bump_pattern = '^(feat|fix)\(gen\)'
changelog_pattern = '^(feat|fix)\(gen\)'
