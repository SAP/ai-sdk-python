[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-ai-sdk-gen"
version = "7.4.1"
description = "SAP Cloud SDK for AI (Python): generative AI SDK (meta-package)"
readme = "PYPIDESCRIPTION.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SAP SE" }]
keywords = ["SAP AI Core", "SAP generative AI SDK", "SAP Generative AI Hub"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 7",
    "Operating System :: Microsoft :: Windows :: Windows 8",
    "Operating System :: Microsoft :: Windows :: Windows 8.1",
    "Operating System :: Microsoft :: Windows :: Windows Server 2008",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
# Meta-package: ships no code of its own. Depends on every subsystem + provider
# distribution so that `pip install sap-ai-sdk-gen` keeps giving existing users the
# full generative-AI SDK surface. Provider langchain wrappers are opt-in via `[all]`.
dependencies = [
    "sap-ai-sdk-proxy>=1.0.0",
    "sap-ai-sdk-openai>=1.0.0",
    "sap-ai-sdk-amazon>=1.0.0",
    "sap-ai-sdk-google>=1.0.0",
    "sap-ai-sdk-rpt>=1.0.0",
    "sap-ai-sdk-orchestration>=1.0.0",
    "sap-ai-sdk-prompt-registry>=1.0.0",
    "sap-ai-sdk-document-grounding>=1.0.0",
    "sap-ai-sdk-batch>=1.0.0",
    "sap-ai-sdk-evaluations>=1.0.0",
]

[project.optional-dependencies]
all = [
    "sap-ai-sdk-openai[langchain]>=1.0.0",
    "sap-ai-sdk-amazon[langchain]>=1.0.0",
    "sap-ai-sdk-google[langchain]>=1.0.0",
    "sap-ai-sdk-evaluations[amazon]>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "pylint==4.0.8",
    "requests-mock==1.12.1",
    "respx==0.23.1",
    "parameterized==0.9.0",
    "pillow==12.3.0",
    "sphinx<9.0.0",
    "myst_nb",
    "sphinxawesome-theme",
    "pytest-dotenv>=0.5.2",
]

[tool.pytest.ini_options]
env_files = [".env"]

[project.urls]
Homepage = "https://www.sap.com/"
Download = "https://pypi.python.org/pypi/sap-ai-sdk-gen"

[tool.uv.sources]
sap-ai-sdk-proxy = { workspace = true }
sap-ai-sdk-openai = { workspace = true }
sap-ai-sdk-amazon = { workspace = true }
sap-ai-sdk-google = { workspace = true }
sap-ai-sdk-rpt = { workspace = true }
sap-ai-sdk-orchestration = { workspace = true }
sap-ai-sdk-prompt-registry = { workspace = true }
sap-ai-sdk-document-grounding = { workspace = true }
sap-ai-sdk-batch = { workspace = true }
sap-ai-sdk-evaluations = { workspace = true }

# Meta-package: ship no Python modules. Exclude the test trees from discovery so the
# build produces a dependency-only wheel with an empty package set.
[tool.setuptools.packages.find]
exclude = ["*test*", "tests*", "integration_tests*"]
namespaces = false

[tool.commitizen]
name = "cz_customize"
tag_format = "gen-v${version}"
ignored_tag_formats = ["*-v${version}"]
version_provider = "pep621"
changelog_file = "RELEASE_NOTES.md"

[tool.commitizen.customize]
bump_pattern = '^(feat|fix)\(gen\)'
changelog_pattern = '^(feat|fix)\(gen\)'
