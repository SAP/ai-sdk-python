[project]
name = "sample-code"
version = "0.1.0"
description = "Sample code for using the AI Core Python SDK"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "sap-ai-sdk-proxy",
    "sap-ai-sdk-openai",
    "sap-ai-sdk-rpt",
    "sap-ai-sdk-langchain",
    "sap-ai-sdk-amazon",
    "sap-ai-sdk-google",
    "sap-ai-sdk-orchestration",
    "sap-ai-sdk-prompt-registry",
    "sap-ai-sdk-document-grounding",
    "uvicorn[standard]>=0.52.1",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
sap-ai-sdk-proxy = { workspace = true, editable = true }
sap-ai-sdk-openai = { workspace = true, editable = true }
sap-ai-sdk-rpt = { workspace = true, editable = true }
sap-ai-sdk-langchain = { workspace = true, editable = true }
sap-ai-sdk-amazon = { workspace = true, editable = true }
sap-ai-sdk-google = { workspace = true, editable = true }
sap-ai-sdk-orchestration = { workspace = true, editable = true }
sap-ai-sdk-prompt-registry = { workspace = true, editable = true }
sap-ai-sdk-document-grounding = { workspace = true, editable = true }
