[project]
name = "ai-sdk-python"
version = "0.0.0"
requires-python = ">=3.10"
license = "Apache-2.0"

[dependency-groups]
dev = ["pip-licenses>=5.5.5", "commitizen>=4"]
sample = ["fastapi>=0.115", "uvicorn>=0.30", "python-dotenv>=1.0"]

[tool.uv.sources]
sap-ai-sdk-base = { workspace = true }
sap-ai-sdk-core = { workspace = true }
sap-ai-sdk-gen = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pip-licenses]
# Blue Oak Council Bronze+ permissive licenses (https://blueoakcouncil.org/list)
# --partial-match is enabled, so each entry matches as a substring of the reported license string
allow-only = "Apache;MIT;BSD;ISC;Python Software Foundation;PSF;MPL-2.0;Mozilla Public License 2.0;CC0-1.0;Zlib;0BSD;CNRI-Python;Unlicense;Public Domain"
partial-match = true
ignore-packages = ["pylint", "astroid"]

[tool.pytest]
markers = [
    "bedrock: mark a test as a bedrock test running in a different environment",
]

[tool.pylint.main]
ignore-paths = ["packages/gen/gen_ai_hub/proxy/native/rpt_1_5/generated"]
init-hook = "import sys; sys.path.insert(0, 'packages/gen/gen_ai_hub/proxy/native/rpt_1_5'); sys.path.insert(0, 'packages/gen'); sys.path.insert(0, 'packages/core'); sys.path.insert(0, 'packages/base')"
extension-pkg-allow-list = ["httpx"]

[tool.pylint.design]
max-args = 6
max-positional-arguments = 6

[tool.pylint.similarities]
min-similarity-lines = 20
